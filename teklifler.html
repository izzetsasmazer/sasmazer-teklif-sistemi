<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kayıtlı Teklifler — Şaşmazer</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,Helvetica,sans-serif;background:#f0f2f5;color:#071426}
    header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);padding:0}
    .header-inner{max-width:1100px;margin:auto;padding:16px 18px;display:flex;align-items:center;gap:14px}
    .header-inner img{height:44px;object-fit:contain}
    .header-text h1{color:#fff;font-size:19px;font-weight:700;margin:0}
    .header-text p{color:rgba(255,255,255,.65);font-size:12px;margin-top:2px}
    .back-btn{margin-left:auto;background:rgba(255,255,255,.12);color:white;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
    .back-btn:hover{background:rgba(255,255,255,.22)}
    main{max-width:1100px;margin:20px auto;padding:0 14px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
    .toolbar input{padding:9px 14px;border:1.5px solid #dde3ec;border-radius:9px;font-size:14px;width:260px}
    .toolbar input:focus{outline:none;border-color:#0f3460}
    .del-all{background:#e74c3c;color:white;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer}
    .empty{text-align:center;color:#888;padding:50px 20px;font-size:15px}
    .card{background:white;border-radius:13px;box-shadow:0 2px 10px #0001;border:1px solid #e4e9f0;margin-bottom:12px;overflow:hidden}
    .card-head{background:#f7f9fc;padding:13px 16px;border-bottom:1px solid #e8ecf2;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
    .card-musteri{font-size:16px;font-weight:700;color:#1a1a2e}
    .card-meta{font-size:12px;color:#666;margin-top:3px}
    .card-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
    .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
    .badge-net{background:#fde8e8;color:#c90000}
    .badge-kamp{background:#fff3cd;color:#7a4200}
    .card-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
    .btn-wa{background:#25D366;color:white;border:none;border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer;font-weight:600}
    .btn-pdf{background:#555;color:white;border:none;border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer}
    .btn-del{background:#f0f2f5;color:#888;border:none;border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer}
    .btn-del:hover{background:#ffe0e0;color:#c00}
    .card-body{padding:12px 16px}
    .urun-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0f2f5;font-size:13px}
    .urun-row:last-child{border-bottom:none}
    .urun-name{color:#222}
    .urun-paro{font-size:11px;color:#c90000;margin-top:1px}
    .urun-price{font-weight:600;color:#1a1a2e;white-space:nowrap;margin-left:12px}
    .analiz{background:#fafbfc;border-top:1px solid #e8ecf2;padding:10px 16px;display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
    .analiz-item{display:flex;flex-direction:column}
    .analiz-label{font-size:11px;color:#888;margin-bottom:2px}
    .analiz-val{font-weight:700;color:#1a1a2e}
    .analiz-val.red{color:#c90000}
    .odeme-sec{background:#f0f4ff;border-top:1px solid #dce5f5;padding:10px 16px;display:none}
    .odeme-sec.open{display:block}
    .odeme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
    .odeme-box{background:white;border:1px solid #dde3ec;border-radius:8px;overflow:hidden}
    .odeme-head{padding:7px 10px;font-size:12px;font-weight:700;text-align:center}
    .odeme-head.low{background:linear-gradient(90deg,#1a1a2e,#0f3460);color:white}
    .odeme-head.high{background:linear-gradient(90deg,#f0a500,#e8c300);color:#1a1a2e}
    .odeme-row{display:flex;justify-content:space-between;padding:5px 10px;font-size:12px;border-bottom:1px solid #f0f2f5}
    .odeme-row:last-child{border-bottom:none}
    .toggle-odeme{background:#0f3460;color:white;border:none;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;margin-top:4px}
    @media(max-width:600px){
      .odeme-grid{grid-template-columns:1fr}
      .card-actions{width:100%}
    }
  </style>
</head>

<script>
function money(v){
  return "₺" + Math.round(v||0).toLocaleString("tr-TR");
}
function escH(v){
  return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function phoneToWA(p){
  const d = p.replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("90")) return d;
  if(d.startsWith("0")) return "90" + d.slice(1);
  return "90" + d;
}

function buildWAMsg(t, karYuzde){
  let msg = "🛒 *Şaşmazer Teklif*\n";
  msg += "👤 " + t.musteri + "\n";
  if(t.tarih) msg += "📅 " + t.tarih + "\n";
  msg += "──────────────────\n";
  for(const u of t.urunler){
    msg += "• " + u.name + "  " + money(u.sales) + (u.qty > 1 ? " x" + u.qty : "") + "\n";
  }
  if(t.kampanyalar && t.kampanyalar.length){
    msg += "\n🎯 *Kampanya:* " + t.kampanyalar.join(" + ") + "\n";
    if(t.bundleDiscount) msg += "   İndirim: " + money(t.bundleDiscount) + "\n";
  }
  msg += "\n💰 *İndirimli Satış: " + money(t.netSatis) + "*\n";
  const tablo = karYuzde === 3 ? t.pay3 : t.pay5;
  if(tablo && tablo.length){
    msg += "\n📊 *Ödeme (Kar %" + karYuzde + ")*\n";
    for(const r of tablo) msg += "   " + r.label + ": *" + money(r.price) + "*\n";
  }
  msg += "\n_beyazesyaburada.com_";
  return msg;
}

function waGonder(id){
  const list = JSON.parse(localStorage.getItem("teklifler")||"[]");
  const t = list.find(x => x.id === id);
  if(!t) return;
  const karYuzde = t.seciliKar || 3;
  const msg = buildWAMsg(t, karYuzde);
  const waNum = phoneToWA(t.telefon || "");
  const url = waNum ? "https://wa.me/" + waNum + "?text=" + encodeURIComponent(msg)
                    : "https://wa.me/?text=" + encodeURIComponent(msg);
  window.open(url,"_blank");
}

function silTeklif(id){
  if(!confirm("Bu teklif silinsin mi?")) return;
  let list = JSON.parse(localStorage.getItem("teklifler")||"[]");
  list = list.filter(t => t.id !== id);
  localStorage.setItem("teklifler", JSON.stringify(list));
  renderList();
}

}

function clearAll(){
  if(!confirm("Tüm kayıtlı teklifler silinsin mi?")) return;
  localStorage.removeItem("teklifler");
  renderList();
}

function renderList(){
  const q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
  let list = JSON.parse(localStorage.getItem("teklifler")||"[]");
  if(q) list = list.filter(t => (t.musteri||"").toLowerCase().includes(q) || (t.telefon||"").includes(q));

  const container = document.getElementById("listContainer");
  if(!list.length){
    container.innerHTML = "<div class='empty'>📭 Henüz kayıtlı teklif yok.<br><a href='index.html' style='color:#0f3460'>Ana sayfaya dön</a></div>";
    return;
  }

  container.innerHTML = list.map(t => {
    const kamp = (t.kampanyalar && t.kampanyalar.length) ? t.kampanyalar.join(" + ") : "";
    const urunlerHtml = t.urunler.map(u => {
      const paroHtml = u.paroDiscount ? "<div class='urun-paro'>Paro: -" + money(u.paroDiscount) + "</div>" : "";
      return "<div class='urun-row'><div class='urun-name'>" + escH(u.name) + (u.qty > 1 ? " <span style='color:#888'>x" + u.qty + "</span>" : "") + paroHtml + "</div><div class='urun-price'>" + money(u.sales) + "</div></div>";
    }).join("");

    const pay3Html = (t.pay3 && t.pay3.length) ? t.pay3.map(r => "<div class='odeme-row'><span>" + escH(r.label) + "</span><b>" + money(r.price) + "</b></div>").join("") : "<div class='odeme-row'><span>—</span></div>";
    const pay5Html = (t.pay5 && t.pay5.length) ? t.pay5.map(r => "<div class='odeme-row'><span>" + escH(r.label) + "</span><b>" + money(r.price) + "</b></div>").join("") : "<div class='odeme-row'><span>—</span></div>";

    return `<div class="card">
      <div class="card-head">
        <div>
          <div class="card-musteri">👤 ${escH(t.musteri)}</div>
          <div class="card-meta">
            ${t.telefon ? "📱 " + escH(t.telefon) + " &nbsp;·&nbsp; " : ""}
            📅 ${escH(t.tarih)} &nbsp;·&nbsp; Kayıt: ${escH(t.kaydTarihi)}
          </div>
          <div class="card-badges">
            <span class="badge badge-net">💰 ${money(t.netSatis)}</span>
            <span class="badge" style="background:#e8f0fe;color:#1a1a2e">Kar %${t.seciliKar||3}</span>
            ${kamp ? '<span class="badge badge-kamp">🎯 ' + escH(kamp) + '</span>' : ""}
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-wa" onclick="waGonder(${t.id})">📲 WhatsApp</button>
          <button class="btn-pdf" onclick="pdfGoster(${t.id})">🖨️ PDF</button>
          <button class="toggle-odeme" onclick="toggleOdeme(${t.id})">Fiyatlar ▾</button>
          <button class="btn-del" onclick="silTeklif(${t.id})">Sil</button>
        </div>
      </div>
      <div class="card-body">${urunlerHtml}</div>
      <div class="analiz">
        ${t.grossSales ? '<div class="analiz-item"><span class="analiz-label">İndirimsiz Satış</span><span class="analiz-val">' + money(t.grossSales) + '</span></div>' : ""}
        ${t.bundleDiscount ? '<div class="analiz-item"><span class="analiz-label">Kampanya İndirimi</span><span class="analiz-val red">-' + money(t.bundleDiscount) + '</span></div>' : ""}
        ${t.singleParoDiscount ? '<div class="analiz-item"><span class="analiz-label">Paro İndirimi</span><span class="analiz-val red">-' + money(t.singleParoDiscount) + '</span></div>' : ""}
        <div class="analiz-item"><span class="analiz-label">İndirimli Satış</span><span class="analiz-val red">${money(t.netSatis)}</span></div>
      </div>
      <div class="odeme-sec" id="odeme-${t.id}">
        <div class="odeme-grid">
          <div class="odeme-box"><div class="odeme-head low">KAR %3</div>${pay3Html}</div>
          <div class="odeme-box"><div class="odeme-head high">KAR %5</div>${pay5Html}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

renderList();
</script>
</body>
</html>
